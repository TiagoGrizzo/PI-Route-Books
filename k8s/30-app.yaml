apiVersion: apps/v1
kind: Deployment
metadata: { name: backend, namespace: routebooks }
spec:
  replicas: 1
  selector: { matchLabels: { app: backend } }
  template:
    metadata: { labels: { app: backend } }
    spec:
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mysql-db 3306; do echo aguardando mysql; sleep 2; done"]
      containers:
        - name: api
          image: routebooks-api:dev
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          envFrom:
            - secretRef: { name: backend-secrets }
            - configMapRef: { name: backend-config }
          readinessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: { name: backend, namespace: routebooks }
spec:
  selector: { app: backend }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend, namespace: routebooks }
spec:
  replicas: 1
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      containers:
        - name: web
          image: routebooks-web:dev
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata: { name: frontend, namespace: routebooks }
spec:
  selector: { app: frontend }
  ports: [{ port: 80, targetPort: 80 }]